name: Publish weekly Raceland newsletter

on:
  # GitHub Actions cron uses UTC: 13:00 UTC is 21:00 in Asia/Shanghai.
  schedule:
    - cron: "0 13 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-weekly-newsletter
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out newsletter site
        uses: actions/checkout@v4

      - name: Check out newsletter PDF source
        uses: actions/checkout@v4
        with:
          repository: STDquantum/F1
          path: f1-source
          # The secret is required only when STDquantum/F1 is private.
          token: ${{ secrets.F1_REPO_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install publishing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow playwright pymupdf pytesseract
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng

      - name: Publish this week's newsletter
        env:
          RACELAND_PDF_DIR: ${{ github.workspace }}/f1-source/raceland_Newsletter
        run: python publish_weekly.py --week current

      - name: Commit and deploy generated site
        run: |
          git add docs
          if git diff --cached --quiet; then
            echo "No site changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: publish weekly newsletter"
          git push
