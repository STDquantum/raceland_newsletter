name: Publish weekly Raceland newsletter

on:
  # GitHub Actions cron uses UTC: 12:30 UTC is 20:30 in Asia/Shanghai.
  schedule:
    - cron: "30 12 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-weekly-newsletter
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out newsletter site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install publishing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow playwright pymupdf pytesseract pypdf
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng

      - name: Download combined newsletter PDF
        run: |
          mkdir -p tmp
          curl --fail --location --retry 3 --retry-delay 5 \
            --user-agent "raceland-newsletter-actions" \
            --output tmp/ausgabe.pdf \
            https://newsletter.raceland.de/gb/epaper/ausgabe.pdf

      - name: Split newest and previous newsletters
        run: |
          python scripts/split_raceland_pdf.py \
            --input tmp/ausgabe.pdf \
            --output-dir raceland_Newsletter \
            --archive-dir raceland_Newsletter \
            --manifest tmp/raceland-manifest.txt

      - name: Publish this week's newsletter
        env:
          RACELAND_PDF_DIR: ${{ github.workspace }}/raceland_Newsletter
        run: python publish_weekly.py --week current

      - name: Commit and deploy generated site
        run: |
          git add docs raceland_Newsletter scripts/split_raceland_pdf.py
          if git diff --cached --quiet; then
            echo "No site changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: publish weekly newsletter"
          git push
